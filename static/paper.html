<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Paper Trader</title><style>body{margin:0;background:#080b12;color:#eef3fb;font:14px system-ui}main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:#101622;border:1px solid #26344d;border-radius:12px;padding:14px;margin-top:12px}.metric{border:1px solid #26344d;border-radius:9px;padding:12px}.metric span{display:block;color:#91a0b6;font-size:11px}.metric b{font-size:20px}.green{color:#35d795}.red{color:#ff6978}button,input{padding:10px;border-radius:8px;border:1px solid #26344d;background:#0b101a;color:#eef3fb}button{cursor:pointer}.row{display:grid;grid-template-columns:1fr 100px 100px 100px 100px;gap:8px;padding:10px 0;border-bottom:1px solid #26344d}.muted{color:#91a0b6;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 80px 80px}.row>*:nth-child(n+4){display:none}}</style></head><body><main><h1>🤖 AI Small-Cap Paper Trader</h1><div class="muted">Simulation only. No live orders are sent to Trading 212.</div><div class="grid"><div class="metric"><span>Equity</span><b id="equity">—</b></div><div class="metric"><span>Cash</span><b id="cash">—</b></div><div class="metric"><span>Daily loss</span><b id="loss">—</b></div><div class="metric"><span>Status</span><b id="status">—</b></div></div><div class="box"><b>Risk controls</b><p class="muted">Default: 1% equity risk per trade · 10% max position · 3% daily loss kill switch.</p><button onclick="kill()">🛑 Kill switch</button> <button onclick="reset()">Reset paper account</button></div><div class="box"><h2>Open positions</h2><div id="positions">None</div></div><div class="box"><h2>Trade history</h2><div id="trades">None</div></div><div class="box"><h2>Top scanner candidates</h2><div id="candidates">Loading…</div></div></main><script>const $=id=>document.getElementById(id);const money=x=>'$'+Number(x||0).toFixed(2);async function refresh(){let p=await fetch('/api/paper').then(r=>r.json());$('equity').textContent=money(p.equity);$('cash').textContent=money(p.cash);$('loss').textContent=p.daily_loss_pct.toFixed(2)+'%';$('loss').className=p.daily_loss_pct>=2?'red':'';$('status').textContent=p.enabled?'RUNNING':'STOPPED';$('status').className=p.enabled?'green':'red';$('positions').innerHTML=p.positions.length?p.positions.map(x=>`<div class="row"><b>${x.ticker}</b><span>${x.qty}</span><span>${money(x.entry)}</span><span>${money(x.stop)}</span><button onclick="sell('${x.ticker}')">Sell</button></div>`).join(''):'None';$('trades').innerHTML=p.trades.length?[...p.trades].reverse().map(x=>`<div class="row"><b>${x.action} ${x.ticker}</b><span>${x.qty||''}</span><span>${money(x.price)}</span><span class="${(x.pnl||0)>=0?'green':'red'}">${x.pnl==null?'':money(x.pnl)}</span><span class="muted">${x.reason||''}</span></div>`).join(''):'None';let s=await fetch('/api/stocks').then(r=>r.json());$('candidates').innerHTML=s.rows.slice(0,10).map(x=>`<div class="row"><b>${x.ticker}</b><span>${x.change_pct.toFixed(1)}%</span><span>${x.quant?.score||0}/100</span><span>${x.catalyst_type||''}</span><button onclick="buy('${x.ticker}')">Paper buy</button></div>`).join('')||'No candidates yet';}async function buy(ticker){let s=await fetch('/api/stocks').then(r=>r.json());let x=s.rows.find(r=>r.ticker===ticker);if(!x)return;let stop=+(x.price*.93).toFixed(4);let target=+(x.price*1.15).toFixed(4);let r=await fetch('/api/paper/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker,price:x.price,stop,target})});let d=await r.json();if(!r.ok)alert(d.detail||JSON.stringify(d));refresh()}async function sell(ticker){let s=await fetch('/api/stocks').then(r=>r.json());let x=s.rows.find(r=>r.ticker===ticker);let r=await fetch('/api/paper/sell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker,price:x?.price,reason:'manual'})});let d=await r.json();if(!r.ok)alert(d.detail||JSON.stringify(d));refresh()}async function kill(){await fetch('/api/paper/kill-switch',{method:'POST'});refresh()}async function reset(){if(confirm('Reset the paper account and delete simulated trade history?')){await fetch('/api/paper/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cash:1000})});refresh()}}refresh();setInterval(refresh,5000)</script></body></html>
