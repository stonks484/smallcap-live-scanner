<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Small-Cap Live Scanner</title><style>html,body{margin:0;background:#080b12;color:#eef3fb;font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#scannerCore{display:block;width:100%;height:5200px;border:0}.boot{padding:14px;background:#101622;border-bottom:1px solid #26344d;color:#91a0b6}.boot b{color:#eef3fb}.fallback{display:none}</style></head><body><div class="boot"><b>⚡ Small-Cap Live Scanner</b> — loading the scanner and adding Short Volume & Buy Volume directly inside the TradingView Market Screener panel…</div><iframe id="scannerCore" src="scanner-core.html" title="Small-Cap Live Scanner"></iframe><script>
(function(){
const FINRA='../data/short_volume.json';
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n);if(!Number.isFinite(n))return'—';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toFixed(0)};
function inject(doc){
 if(!doc||doc.getElementById('volumeIntelligence'))return;
 const screener=doc.querySelector('.screener'); const host=screener?.closest('.panel');
 if(!host)return false;
 const box=doc.createElement('section');box.id='volumeIntelligence';
 box.innerHTML=`<style>#volumeIntelligence{margin:12px;border:1px solid #26344d;border-radius:12px;background:#0c111b;overflow:hidden;color:#eef3fb}#volumeIntelligence .vi-head{padding:12px;border-bottom:1px solid #26344d;display:flex;justify-content:space-between;gap:10px;align-items:center}#volumeIntelligence .vi-title{font-weight:850}#volumeIntelligence .vi-muted{color:#91a0b6;font-size:11px}#volumeIntelligence .vi-search{display:flex;gap:7px;padding:10px;border-bottom:1px solid #26344d}#volumeIntelligence input{flex:1;min-width:0;background:#080b12;border:1px solid #26344d;border-radius:9px;padding:9px;color:#eef3fb}#volumeIntelligence button{background:#16243a;border:1px solid #385276;color:#eef3fb;border-radius:9px;padding:9px 12px;cursor:pointer}#volumeIntelligence .vi-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}#volumeIntelligence .vi-card{background:#101622;border:1px solid #26344d;border-radius:9px;padding:9px}.vi-card label{display:block;color:#91a0b6;font-size:9px;text-transform:uppercase}.vi-card strong{display:block;margin-top:3px;font-size:15px}#volumeIntelligence .vi-note{padding:0 10px 9px;color:#91a0b6;font-size:10px}#volumeIntelligence .vi-table{overflow:auto;padding:0 10px 10px}#volumeIntelligence table{width:100%;border-collapse:collapse;font-size:10px}#volumeIntelligence th,#volumeIntelligence td{padding:6px;border-bottom:1px solid #26344d;text-align:left;white-space:nowrap}#volumeIntelligence .vi-status{padding:8px 10px;background:#101622;border-top:1px solid #26344d;color:#91a0b6;font-size:10px}@media(max-width:650px){#volumeIntelligence .vi-cards{grid-template-columns:1fr 1fr}#volumeIntelligence .vi-search{flex-wrap:wrap}#volumeIntelligence button{flex:1}}</style><div class="vi-head"><div><div class="vi-title">📊 SHORT VOLUME & BUY VOLUME</div><div class="vi-muted">Volume intelligence for the ticker you search — now part of this screener panel</div></div><span class="vi-muted" id="viDate">FINRA daily</span></div><div class="vi-search"><input id="viTicker" value="AAPL" placeholder="Ticker e.g. AAPL"><button id="viAnalyse">Analyse volume</button><button id="viUseTicker">Use scanner ticker</button></div><div class="vi-cards"><div class="vi-card"><label>Short volume</label><strong id="viShort">—</strong></div><div class="vi-card"><label>Short-volume ratio</label><strong id="viRatio">—</strong></div><div class="vi-card"><label>Total reported volume</label><strong id="viTotal">—</strong></div><div class="vi-card"><label>Buy volume</label><strong id="viBuy">Not reported</strong></div></div><div class="vi-note">FINRA short-sale volume is daily/delayed and is not short interest. FINRA does not provide a universal consolidated buy-volume figure, so no buy number is fabricated. A true buy/sell split needs trade-side data.</div><div class="vi-table"><table><thead><tr><th>Date</th><th>Short</th><th>Exempt</th><th>Total</th><th>Short %</th><th>Market</th></tr></thead><tbody id="viRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div><div class="vi-status" id="viStatus">Loading free FINRA daily data…</div>`;
 const widget=screener; widget.insertAdjacentElement('afterend',box);
 const $=id=>doc.getElementById(id);
 function render(data,t){const rows=(data||[]).filter(x=>String(x.symbol||'').toUpperCase()===t.toUpperCase()).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const x=rows[0];if(!x){$('viShort').textContent='—';$('viRatio').textContent='—';$('viTotal').textContent='—';$('viBuy').textContent='Not reported';$('viRows').innerHTML='<tr><td colspan="6">No FINRA record found for <b>'+esc(t)+'</b>.</td></tr>';$('viStatus').textContent='No daily FINRA record found for '+t+'.';return}const ratio=x.total_volume?x.short_volume/x.total_volume*100:null;$('viShort').textContent=fmt(x.short_volume);$('viRatio').textContent=ratio==null?'—':ratio.toFixed(2)+'%';$('viTotal').textContent=fmt(x.total_volume);$('viBuy').textContent='Not reported';$('viDate').textContent=x.date;$('viStatus').textContent='FINRA data loaded • latest trading date '+x.date;$('viRows').innerHTML=rows.slice(0,10).map(r=>{const q=r.total_volume?r.short_volume/r.total_volume*100:null;return'<tr><td>'+esc(r.date)+'</td><td>'+fmt(r.short_volume)+'</td><td>'+fmt(r.short_exempt_volume)+'</td><td>'+fmt(r.total_volume)+'</td><td>'+(q==null?'—':q.toFixed(2)+'%')+'</td><td>'+esc(r.market||'')+'</td></tr>'}).join('')}
 async function load(t){t=(t||'').trim().toUpperCase().replace(/[^A-Z0-9./-]/g,'');if(!t)return;$('viStatus').textContent='Loading FINRA data for '+t+'…';try{const r=await fetch(FINRA+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();render(await r.json(),t)}catch(e){$('viStatus').textContent='FINRA dataset is not available yet; waiting for the scheduled updater.';$('viRows').innerHTML='<tr><td colspan="6">Waiting for the free daily FINRA dataset.</td></tr>'}}
 $('viAnalyse').onclick=()=>load($('viTicker').value);$('viTicker').addEventListener('keydown',e=>{if(e.key==='Enter')load($('viTicker').value)});$('viUseTicker').onclick=()=>{const t=doc.getElementById('ticker')?.value;if(t){$('viTicker').value=t.split(':').pop();load($('viTicker').value)}};load('AAPL');return true;
}
function wait(){const f=document.getElementById('scannerCore');try{if(inject(f.contentDocument)){document.querySelector('.boot').innerHTML='<b>✓ Volume intelligence added inside the TradingView Market Screener panel.</b> You can search any ticker there.';return}}catch(e){}setTimeout(wait,300)}document.getElementById('scannerCore').addEventListener('load',wait);wait();
})();
</script></body></html>
