name: Inject volume section into dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject short-volume panel
        shell: python
        run: |
          from pathlib import Path
          p = Path('static/dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section class="panel chartpanel" id="chartSection">'
          if '<section class="panel volume-panel" id="volumeSection">' in s:
              print('Volume section already present; nothing to do.')
              raise SystemExit(0)
          css = r'''\n.volume-panel{margin-top:12px}.volume-search{display:flex;gap:7px;padding:12px}.volume-search input{flex:1;min-width:0}.volume-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px}.volume-card{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--panel2)}.volume-card label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}.volume-card strong{display:block;font-size:17px;margin-top:4px}.volume-bar{height:8px;background:#182237;border-radius:99px;overflow:hidden;margin-top:8px}.volume-bar i{display:block;height:100%;width:0;background:var(--blue)}.volume-note{padding:0 12px 12px;color:var(--muted);font-size:11px}.volume-table{overflow:auto;padding:0 12px 12px}.volume-table table{width:100%;border-collapse:collapse;font-size:12px}.volume-table th,.volume-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.volume-links{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}.volume-links a{color:#a9c8ff;text-decoration:none}.volume-status{padding:9px 12px;border-top:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11px}\n@media(max-width:650px){.volume-cards{grid-template-columns:1fr 1fr}.volume-search{flex-wrap:wrap}.volume-search .btn{min-width:105px}}\n'''
          html = r'''<section class="panel volume-panel" id="volumeSection">
<div class="panelhead"><div><div class="paneltitle">📊 SHORT VOLUME & BUY VOLUME</div><div class="muted">Search any stock and compare reported short-sale activity with total volume</div></div><span class="pill" id="volumeDate">—</span></div>
<div class="volume-search"><input id="volumeTicker" class="field" value="AAPL" placeholder="Ticker e.g. AAPL" autocomplete="off"><button class="btn primary" id="volumeAnalyse">Analyse volume</button><button class="btn" id="volumeUseTicker">Use searched ticker</button></div>
<div class="volume-cards"><div class="volume-card"><label>Short volume</label><strong id="volumeShort">—</strong><div class="volume-bar"><i id="volumeShortBar"></i></div></div><div class="volume-card"><label>Short-volume ratio</label><strong id="volumeRatio">—</strong><div class="volume-bar"><i id="volumeRatioBar"></i></div></div><div class="volume-card"><label>Total reported volume</label><strong id="volumeTotal">—</strong></div><div class="volume-card"><label>Buy volume</label><strong id="volumeBuy">Not reported</strong></div></div>
<div class="volume-note">Short volume is FINRA daily short-sale volume. It is not short interest. A universal consolidated buy-volume number is not published for every U.S. venue, so the scanner will not invent a buy number. True buy/sell volume can be added when a trade-side feed is connected.</div>
<div class="volume-table"><table><thead><tr><th>Date</th><th>Short volume</th><th>Short exempt</th><th>Total volume</th><th>Short ratio</th><th>Market</th></tr></thead><tbody id="volumeHistory"><tr><td colspan="6" class="muted">Loading FINRA data…</td></tr></tbody></table></div>
<div class="volume-links"><a href="https://www.finra.org/finra-data/browse-catalog/short-sale-volume" target="_blank" rel="noopener">FINRA short-sale data ↗</a><a href="https://www.finra.org/finra-data/browse-catalog/short-sale-volume-data/daily-short-sale-volume-files" target="_blank" rel="noopener">Daily files ↗</a></div>
<div class="volume-status" id="volumeStatus">Waiting for the free daily FINRA dataset.</div>
</section>
'''
          js = r'''<script>
(function(){
  const $v=id=>document.getElementById(id);
  const fmt=v=>{if(v==null||Number.isNaN(Number(v)))return '—';v=Number(v);if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return v.toFixed(0)};
  const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  function renderVolume(data,t){
    const rows=(data||[]).filter(x=>String(x.symbol||'').toUpperCase()===t).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const x=rows[0];
    if(!x){$v('volumeShort').textContent='—';$v('volumeRatio').textContent='—';$v('volumeTotal').textContent='—';$v('volumeBuy').textContent='Not reported';$v('volumeHistory').innerHTML='<tr><td colspan="6">No FINRA record found for <b>'+esc(t)+'</b>.</td></tr>';$v('volumeStatus').textContent='No FINRA daily record found for '+t+'.';return;}
    const ratio=x.total_volume?x.short_volume/x.total_volume*100:null;
    $v('volumeShort').textContent=fmt(x.short_volume)+' shares';$v('volumeRatio').textContent=ratio==null?'—':ratio.toFixed(2)+'%';$v('volumeTotal').textContent=fmt(x.total_volume)+' shares';$v('volumeBuy').textContent='Not reported';$v('volumeDate').textContent=x.date;$v('volumeShortBar').style.width=Math.min(100,ratio||0)+'%';$v('volumeRatioBar').style.width=Math.min(100,ratio||0)+'%';$v('volumeStatus').textContent='FINRA data loaded • '+t+' • latest available date: '+x.date;
    $v('volumeHistory').innerHTML=rows.slice(0,10).map(r=>{const q=r.total_volume?r.short_volume/r.total_volume*100:null;return '<tr><td>'+esc(r.date)+'</td><td>'+fmt(r.short_volume)+'</td><td>'+fmt(r.short_exempt_volume)+'</td><td>'+fmt(r.total_volume)+'</td><td>'+(q==null?'—':q.toFixed(2)+'%')+'</td><td>'+esc(r.market||'')+'</td></tr>'}).join('');
  }
  async function loadVolume(t){t=(t||'').trim().toUpperCase().replace(/[^A-Z0-9./-]/g,'');if(!t)return;$v('volumeStatus').textContent='Loading FINRA short-volume data for '+t+'…';try{const r=await fetch('data/short_volume.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();renderVolume(await r.json(),t)}catch(e){$v('volumeStatus').textContent='FINRA dataset is not available yet; the scheduled GitHub updater will populate it.';$v('volumeHistory').innerHTML='<tr><td colspan="6">Waiting for the first successful daily update.</td></tr>';}}
  $v('volumeAnalyse').onclick=()=>loadVolume($v('volumeTicker').value);$v('volumeTicker').addEventListener('keydown',e=>{if(e.key==='Enter')loadVolume($v('volumeTicker').value)});
  $v('volumeUseTicker').onclick=()=>{const t=($v('ticker')?.value||'').split(':').pop();if(t){$v('volumeTicker').value=t;loadVolume(t);$v('volumeSection').scrollIntoView({behavior:'smooth'})}};
  const sync=()=>{const t=($v('ticker')?.value||'').split(':').pop();if(t){$v('volumeTicker').value=t;loadVolume(t)}};
  $v('analyse')?.addEventListener('click',()=>setTimeout(sync,450));$v('ticker')?.addEventListener('change',sync);
  loadVolume($v('volumeTicker').value);
})();
</script>
'''
          if marker not in s:
              raise SystemExit('Chart section marker not found; dashboard was not changed.')
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace(marker,html+marker,1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Injected volume section into static/dashboard.html')
      - name: Commit and remove one-time patcher
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/dashboard.html
          if git diff --cached --quiet; then
            git rm .github/workflows/inject-volume-dashboard.yml
            git commit -m 'Remove completed volume dashboard patcher'
          else
            git rm .github/workflows/inject-volume-dashboard.yml
            git add static/dashboard.html
            git commit -m 'Add short-volume panel to scanner dashboard'
          fi
          git push
