name: Update FINRA short volume

on:
  push:
    branches: [main]
    paths:
      - 'static/dashboard.html'
      - '.github/workflows/short-volume.yml'
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-short-volume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest FINRA consolidated short-volume file
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.request
          from pathlib import Path

          def get(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 smallcap-live-scanner/1.0',
                  'Accept': 'text/plain,*/*'
              })
              return urllib.request.urlopen(req, timeout=45).read().decode('utf-8', 'ignore')

          def parse(raw):
              lines = [x.strip() for x in raw.splitlines() if x.strip()]
              if not lines or not lines[0].startswith('Date|Symbol|ShortVolume'):
                  return []
              rows = []
              for line in lines[1:]:
                  parts = line.split('|')
                  if len(parts) != 6:
                      continue
                  try:
                      rows.append({
                          'date': parts[0],
                          'symbol': parts[1],
                          'short_volume': float(parts[2]),
                          'short_exempt_volume': float(parts[3]),
                          'total_volume': float(parts[4]),
                          'market': parts[5],
                      })
                  except ValueError:
                      continue
              return rows

          today = dt.date.today()
          found = None
          for days_back in range(0, 10):
              d = today - dt.timedelta(days=days_back)
              stamp = d.strftime('%Y%m%d')
              direct = f'https://cdn.finra.org/equity/regsho/daily/CNMSshvol{stamp}.txt'
              candidates = [direct, f'https://r.jina.ai/{direct}']
              for url in candidates:
                  try:
                      raw = get(url)
                      rows = parse(raw)
                      if rows:
                          found = (url, rows)
                          break
                  except Exception as e:
                      print(f'Fetch failed: {url} -> {e}')
              if found:
                  break

          if not found:
              raise SystemExit('Could not retrieve a recent FINRA consolidated short-volume file from FINRA CDN or the free Reader fallback.')

          url, rows = found
          Path('data').mkdir(exist_ok=True)
          Path('data/short_volume.json').write_text(json.dumps(rows, separators=(',', ':')), encoding='utf-8')
          Path('data/short_volume_meta.json').write_text(json.dumps({
              'source': 'FINRA',
              'url': url,
              'trade_date': rows[0]['date'] if rows else None,
              'row_count': len(rows),
              'retrieved_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
          }, separators=(',', ':')), encoding='utf-8')
          print(f'Wrote {len(rows)} rows from {url}')
          PY

      - name: Commit updated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/short_volume.json data/short_volume_meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update FINRA short volume data'
          git push
